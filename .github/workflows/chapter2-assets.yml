name: Chapter 2 Generate Assets
on:
  push:
    branches: [friday-night-funkin-vs-tankman-chapter-2]
    paths:
      - 'tools/chapter2_factory.py'
      - '.github/workflows/chapter2-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create music, charts and backgrounds
        run: python tools/chapter2_factory.py
      - name: Validate charts and original Tankman reference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('mods/tankman-chapter-2')
          assert len(list(base.glob('data/*/*.json'))) >= 24
          for p in base.glob('data/*/*.json'):
              j=json.loads(p.read_text())
              if 'notes' in j:
                  assert len(j['notes'])==48 and j['format']=='psych_v1',p
          assert len(list(base.glob('songs/*/Inst.ogg')))==6
          assert not (base/'images/characters/ch2-tankman.png').exists()
          assert (base/'images/chapter2/sky.png').exists()
          assert (base/'songs/redeploy/Inst.ogg').exists()
          print('Original Tankman comes from base-game character tankman.')
          print('All six tracks and original sprite atlas validated.')
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/tankman-chapter-2 assets/shared/images/chapter2/menu.png assets/shared/images/mainmenu/menu_chapter2.png assets/shared/images/mainmenu/menu_chapter2.xml
          if ! git diff --cached --quiet; then
            git commit -m "build(chapter2): render six tracks, 18 charts, sprites, stage and menu"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep 3
            done
            echo "Could not publish generated assets" >&2
            exit 1
          fi
