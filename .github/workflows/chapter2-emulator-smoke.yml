name: Chapter 2 Android Emulator Smoke Test
on:
  push:
    branches: [friday-night-funkin-vs-tankman-chapter-2]
    paths:
      - '.github/workflows/chapter2-emulator-smoke.yml'
      - 'tools/chapter2_emulator_smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout smoke test
        uses: actions/checkout@v4
      - name: Download actual APK from Chapter 2 rebuilt Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-apk
          gh run download 38090870479 -R "$GITHUB_REPOSITORY" -n Vs-Tankman-Chapter2-Android-APK -D smoke-apk
          ls -lah smoke-apk
      - name: Enable KVM to accelerate Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and open app on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8192M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/chapter2_emulator_smoke.sh
      - name: Publish screenshots and crash logs even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapter2-Android-Smoke-Logs
          path: smoke-results/
          if-no-files-found: warn
