name: Chapter 2 Downloadable Mod ZIP
on:
  push:
    branches: [friday-night-funkin-vs-tankman-chapter-2]
    paths:
      - '.github/workflows/chapter2-package.yml'
      - 'tools/chapter2_factory.py'
      - 'mods/tankman-chapter-2/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mods/tankman-chapter-2
            releases
          sparse-checkout-cone-mode: false
      - name: Package standalone six-song demo
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          target=Path('releases/Vs-Tankman-Chapter2-v0.1-demo.zip')
          target.parent.mkdir(parents=True,exist_ok=True)
          base=Path('mods/tankman-chapter-2')
          files=sorted(p for p in base.rglob('*') if p.is_file())
          assert len(list(base.glob('songs/*/Inst.ogg')))==6
          assert len(list(base.glob('data/*/*.json')))>=24
          with ZipFile(target,'w',ZIP_DEFLATED,compresslevel=7) as out:
              for p in files:out.write(p,p.relative_to('mods'))
          print('Packaged',len(files),'files, bytes:',target.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Vs-Tankman-Chapter2-Mod-ZIP
          path: releases/Vs-Tankman-Chapter2-v0.1-demo.zip
      - name: Commit direct-download ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Vs-Tankman-Chapter2-v0.1-demo.zip
          if ! git diff --cached --quiet; then
            git commit -m "release(chapter2): portable v0.1 six-song mod zip"
            git push
          fi
