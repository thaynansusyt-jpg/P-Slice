name: Vs Tankman Chapter 2 Android APK
on:
  push:
    branches: [friday-night-funkin-vs-tankman-chapter-2]
    paths:
      - '.github/workflows/chapter2-apk.yml'
      - 'Project.xml'
      - 'source/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: chapter2-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Chapter 2
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify final Chapter 2 PLUS content before native compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("mods/tankman-chapter-2")
          songs=["redeploy","blackout","onslaught","warzone",
                 "last-stand","no-more-heroes","ugh-radio-remix"]
          for slug in songs:
              for item in ("Inst.ogg","Voices.ogg"):
                  file=root/"songs"/slug/item
                  assert file.is_file() and file.stat().st_size>10000, file
              for difficulty in ("easy","normal","hard"):
                  suffix="" if difficulty=="normal" else "-"+difficulty
                  path=root/"data"/slug/(slug+suffix+".json")
                  chart=json.loads(path.read_text())
                  assert chart["needsVoices"], path
                  assert len(chart["notes"])>=40, path
          assert (root/"scripts"/"chapter2-mission-feed.lua").is_file()
          week=json.loads((root/"weeks"/"tankman-chapter-2.json").read_text())
          assert len(week["songs"])==7, "WAR ROOM not configured for 7 missions"
          print("PASS: all 7 PLUS songs, 7 vocal stems, 21 charts and mission script present")
          PY
      - name: Set up Haxe 4.3.6
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.3.6'
      - name: Restore compilation dependencies
        id: libs
        uses: actions/cache/restore@v4
        with:
          path: .haxelib/
          key: chapter2-mobile-dependencies-${{ runner.os }}-${{ hashFiles('setup/mobile.sh') }}
          restore-keys: |
            P-Slice.1.0.mobile-cache
      - name: Install mobile Haxe libraries if uncached
        if: steps.libs.outputs.cache-hit != 'true'
        run: |
          haxelib newrepo
          bash ./setup/mobile.sh
      - name: Cache dependency tree
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .haxelib/
          key: chapter2-mobile-dependencies-${{ runner.os }}-${{ hashFiles('setup/mobile.sh') }}
      - name: Install debug-only Haxe libraries
        run: |
          haxelib install hxcpp-debug-server 1.2.4 --quiet
          haxelib install hscript --quiet
      - name: Configure Android toolchain
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME_17_X64"
          haxelib run lime config ANDROID_SETUP true
      - name: Patch a P-Slice Lime Android Gradle template bug
        run: |
          python - <<'PY'
          from pathlib import Path
          template=Path(".haxelib/lime/git/templates/android/template/app/build.gradle")
          assert template.is_file(), f"Unexpected Lime version or missing template: {template}"
          content=template.read_text()
          needle="firebaseCrashlytics {"
          assert content.count(needle)<=1, "Unexpected Gradle template format - stop safely"
          if needle not in content:
              print("Lime template already patched")
              raise SystemExit(0)
          start=content.index(needle)
          pos=content.index("{",start)
          depth=1
          while depth and pos+1<len(content):
              pos+=1
              if content[pos]=="{": depth+=1
              elif content[pos]=="}": depth-=1
          assert depth==0, "Unbalanced Firebase Gradle block"
          cleaned=content[:start]+content[pos+1:]
          assert needle not in cleaned
          template.write_text(cleaned)
          print("Removed unconditional firebaseCrashlytics closure from cached Lime Android template")
          PY
      - name: Generate Android project and check Crashlytics before native build
        run: |
          haxelib run lime update android -release
          python - <<'PY'
          from pathlib import Path
          roots = [Path("export/release/android/bin"), Path("export/release/android")]
          scripts = sorted({p for root in roots if root.exists() for p in root.rglob("*.gradle")})
          print("Gradle files checked:", len(scripts))
          assert scripts, "No Gradle project generated - aborting before native compilation"
          conflicts = [str(p) for p in scripts if "firebaseCrashlytics {" in p.read_text(errors="replace")]
          if conflicts:
              raise SystemExit("Obsolete Firebase crashlytics Gradle block remains in: " + ", ".join(conflicts))
          print("Gradle preflight OK: no obsolete firebaseCrashlytics block.")
          PY
      - name: Reuse native Android objects after future failed runs
        uses: actions/cache@v4
        with:
          path: |
            export/release/android/obj/
            export/release/android/haxe/
          key: chapter2-android-playtest-release-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            chapter2-android-playtest-release-native-${{ runner.os }}-
          save-always: true
      - name: Build optimized Android release binary
        run: haxelib run lime build android -release
      - name: Restore stable playtest signing key
        uses: actions/cache@v4
        with:
          path: .chapter2-signing/
          key: chapter2-playtest-signing-v1
      - name: Sign optimized standalone APK for Android installation
        run: |
          set -euo pipefail
          mkdir -p chapter2-apk
          apk="$(find export/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "Unsigned/generated APK: $apk"
          mkdir -p .chapter2-signing
          if [ ! -f .chapter2-signing/ch2-playtest.jks ]; then
          keytool -genkeypair -noprompt -keystore .chapter2-signing/ch2-playtest.jks \
            -storepass android -keypass android -alias chapter2 -keyalg RSA \
            -keysize 2048 -validity 3650 -dname "CN=Tankman Chapter 2 Playtest, O=Community"
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/zipalign" -f -p 4 "$apk" chapter2-apk/TankmanChapter2-aligned.apk
          "$build_tools/apksigner" sign --ks .chapter2-signing/ch2-playtest.jks \
            --ks-key-alias chapter2 --ks-pass pass:android --key-pass pass:android \
            --out chapter2-apk/TankmanChapter2-Otimizado.apk chapter2-apk/TankmanChapter2-aligned.apk
          rm chapter2-apk/TankmanChapter2-aligned.apk
          "$build_tools/apksigner" verify --verbose chapter2-apk/TankmanChapter2-Otimizado.apk
          ls -lh chapter2-apk/*
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Vs-Tankman-Chapter2-Android-APK
          path: chapter2-apk/*.apk
          if-no-files-found: error

  android-smoke:
    name: Android 15 startup and Chapter 2 menu runtime
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate full menu instrumentation (not merely app survival)
        run: |
          grep -q 'chapter2-main-menu-ready.marker' tools/chapter2_emulator_smoke.sh
          grep -q 'CHAPTER2_STANDALONE' Project.xml
          echo 'Using app-private menu readiness marker, not title-only status'
      - name: Download freshly compiled APK to test (not an old artifact)
        uses: actions/download-artifact@v4
        with:
          name: Vs-Tankman-Chapter2-Android-APK
          path: smoke-apk
      - name: Enable KVM emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the newly built APK and launch it on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/chapter2_emulator_smoke.sh
      - name: Upload Android smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapter2-New-APK-Android15-Test-Report
          path: smoke-results/
          if-no-files-found: warn
