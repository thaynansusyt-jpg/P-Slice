name: Chapter 2 Android Emulator Smoke Test
# Emulator-only CI. Changes to this workflow or the smoke script reuse
# an existing signed APK; they never trigger a native Haxe/C++ rebuild.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout smoke test
        uses: actions/checkout@v4
      - name: Download existing optimized release APK (no compilation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-apk
          RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" --workflow chapter2-apk.yml --branch friday-night-funkin-vs-tankman-chapter-2 --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          echo "Using fully successful APK workflow run #$RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n Vs-Tankman-Chapter2-Android-APK -D smoke-apk
          ls -lah smoke-apk
      - name: Enable KVM to accelerate Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and open app on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 768M
          disk-size: 8192M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/chapter2_emulator_smoke.sh
      - name: Publish screenshots and crash logs even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapter2-Android-Smoke-Logs
          path: smoke-results/
          if-no-files-found: warn
